<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tajweed App</title>

<style>

/* ОБЩЕЕ */
body {
    margin: 0;
    background: #0f4c3a;
}

/* СТРАНИЦЫ */
.page {
    display: none;
}
.active {
    display: block;
}

/* КОНТЕЙНЕР */
.container {
    position: relative;
    max-width: 420px;
    margin: auto;
}

/* КАРТИНКА */
.bg {
    width: 100%;
    display: block;
}

/* КНОПКИ */
.click {
    position: absolute;
    cursor: pointer;
    transform: translate(-50%, -50%);
}

/* ===== МЕНЮ (НЕ ТРОГАЛ) ===== */

.btn1 { top: 42%; left: 8%; width: 38%; height: 12%; z-index: 5; }
.btn2 { top: 42%; right: 8%; width: 38%; height: 12%; z-index: 5; }

.btn3 { top: 57%; left: 8%; width: 38%; height: 12%; z-index: 5; }
.btn4 { top: 57%; right: 8%; width: 38%; height: 12%; z-index: 5; }

.btn5 { top: 72%; left: 8%; width: 38%; height: 12%; z-index: 5; }
.btn6 { top: 72%; right: 8%; width: 38%; height: 12%; z-index: 5; }

/* НАЗАД */
.backMenu {
    bottom: 2%;
    left: 25%;
    width: 50%;
    height: 8%;
    z-index: 4;
}

/* ===== АЛИФ ===== */

/* РОТ */
.mouth {
    top: 64%;
    left: 73%;
    width: 70px;
    height: 70px;
}

/* ХАРАКАТЫ */
/* ФАТХА */
.a {
    top: 85%;
    left: 18%;
    width: 10%;
    height: 7%;
}

/* КАСРА */
.i {
    top: 85%;
    left: 30%;
    width: 10%;
    height: 7%;
}

/* ДАММА */
.u {
    top: 85%;
    left: 45%;
    width: 10%;
    height: 7%;
}

/* СТРЕЛКИ */
.prev { bottom: 12%; left: 10%; width: 70px; height: 50px; }
.next { bottom: 12%; right: 10%; width: 70px; height: 50px; }

/* НАЗАД */
.back { bottom: 3%; left: 30%; width: 150px; height: 50px; }

</style>
</head>

<body>

<!-- ===== МЕНЮ ===== -->
<div id="menu" class="page active">
  <div class="container">
    <img src="menu.png" class="bg">

    <div class="click btn1" onclick="openPage('alif')"></div>
    <div class="click btn2"></div>

    <div class="click btn3"></div>
    <div class="click btn4"></div>

    <div class="click btn5"></div>
    <div class="click btn6"></div>

    <div class="click backMenu"></div>
  </div>
</div>

<!-- ===== АЛИФ ===== -->
<div id="alif" class="page">
  <div class="container">
    <img src="alif.png" class="bg">

    <!-- РОТ -->
    <div class="click mouth" onclick="playAlif()"></div>

    <!-- ХАРАКАТЫ -->
    <div class="click a" onclick="playA()"></div>
    <div class="click i" onclick="playI()"></div>
    <div class="click u" onclick="playU()"></div>

    <!-- СТРЕЛКИ -->
    <div class="click prev"></div>
    <div class="click next"></div>

    <!-- НАЗАД -->
    <div class="click back" onclick="openPage('menu')"></div>

  </div>
</div>
}
<script>

/* ПЕРЕКЛЮЧЕНИЕ */
function openPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* ЗВУКИ */
function playAlif() {
    new Audio("sounds/alif.mp3").play();
}

function playA() {
    new Audio("sounds/alif_a.mp3").play();
}

function playI() {
    new Audio("sounds/alif_i.mp3").play();
}

function playU() {
    new Audio("sounds/alif_u.mp3").play();
}
document.addEventListener("click", function(e) {
    const rect = document.querySelector(".container").getBoundingClientRect();

    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    let percentX = (x / rect.width * 100).toFixed(2);
    let percentY = (y / rect.height * 100).toFixed(2);

    console.log("X:", percentX + "%", "Y:", percentY + "%");
});
</script>

</body>
</html>
