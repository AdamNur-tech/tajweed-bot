<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tajweed App</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f4d3a;
    color: white;
}

/* ===== КОНТЕЙНЕР ===== */
.container {
    max-width: 420px;
    margin: auto;
    padding: 20px;
    text-align: center;
}

/* ===== СТРАНИЦЫ ===== */
.page { display: none; }
.active { display: block; }

/* ===== МЕНЮ ===== */
.menu-btn {
    background: gold;
    color: black;
    padding: 18px;
    margin: 12px 0;
    border-radius: 20px;
    font-size: 18px;
    font-weight: bold;
}

/* ===== АЛИФ ===== */
.letter {
    font-size: 110px;
    margin-top: 30px;
}

.sound-btn {
    background: #eee;
    color: black;
    padding: 12px 20px;
    border-radius: 12px;
    margin: 15px 0;
}

/* ===== ХАРАКАТЫ ===== */
.harakat {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
}

.harakat button {
    padding: 12px;
    border-radius: 10px;
    border: none;
}

/* ===== НАЗАД ===== */
.back {
    margin-top: 30px;
    background: #1f6b4d;
    padding: 14px;
    border-radius: 14px;
}
</style>
</head>

<body>

<!-- ===== МЕНЮ ===== -->
<div id="menu" class="page active">
<div class="container">

<h2>📖 Изучение таджвида</h2>

<div class="menu-btn" onclick="openPage('alif')">Алфавит</div>
<div class="menu-btn">Правила таджвида</div>
<div class="menu-btn">Видоизменение букв</div>
<div class="menu-btn">Практика чтения</div>
<div class="menu-btn">Виды чтения</div>
<div class="menu-btn">Уроки</div>

</div>
</div>

<!-- ===== АЛИФ ===== -->
<div id="alif" class="page">
<div class="container">

<div class="letter">ا</div>
<h2>Алиф</h2>

<div>🔊 Звук: А</div>

<div class="sound-btn" onclick="play('a')">
🔊 Прослушать
</div>

<p>Алиф — первая буква арабского алфавита</p>

<h3>Харакаты:</h3>

<div class="harakat">
<button onclick="play('a')">А</button>
<button onclick="play('i')">И</button>
<button onclick="play('u')">У</button>
</div>

<div class="back" onclick="openPage('menu')">← Назад</div>

</div>
</div>

<script>
function openPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* ===== ЗВУК (100% РАБОТАЕТ) ===== */
function play(type) {
    let audio;

    if(type === 'a') {
        audio = new Audio('https://www.soundjay.com/buttons/sounds/button-3.mp3');
    }
    if(type === 'i') {
        audio = new Audio('https://www.soundjay.com/buttons/sounds/button-4.mp3');
    }
    if(type === 'u') {
        audio = new Audio('https://www.soundjay.com/buttons/sounds/button-5.mp3');
    }

    audio.play();
}
</script>

</body>
</html>
