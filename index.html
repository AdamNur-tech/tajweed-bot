<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tajweed App</title>

<style>


/* ОБЩЕЕ */
body {
    margin: 0;
    background: #0f4c3a;
}

/* СТРАНИЦЫ */
.page {
    display: none;
}

.active {
    display: block;
}

/* КАРТИНКА */
.container {
    position: relative;
    max-width: 420px;
    margin: auto;
}

/* КАРТИНКА */
.bg {
    width: 100%;
    display: block;
}

/* КНОПКИ */
.click {
    position: absolute;
    cursor: pointer;
}

/* ===== МЕНЮ ===== */

.btn1 { top: 42%; left: 8%; width: 38%; height: 12%; }
.btn2 { top: 42%; right: 8%; width: 38%; height: 12%; }

.btn3 { top: 57%; left: 8%; width: 38%; height: 12%; }
.btn4 { top: 57%; right: 8%; width: 38%; height: 12%; }

.btn5 { top: 72%; left: 8%; width: 38%; height: 12%; }
.btn6 { top: 72%; right: 8%; width: 38%; height: 12%; }

.backMenu {
    bottom: 5%;
    left: 25%;
    width: 50%;
    height: 10%;
}

/* ===== АЛИФ ===== */

/* РОТ */
.mouth {
    top: 58%;
    left: 60%;
    width: 80px;
    height: 80px;
}

/* ХАРАКАТЫ (подогнано под твою картинку) */

.a {
    top: 67%;
    left: 17%;
    width: 75px;
    height: 95px;
}

.i {
    top: 67%;
    left: 40%;
    width: 75px;
    height: 95px;
}

.u {
    top: 67%;
    left: 63%;
    width: 75px;
    height: 95px;
}

/* СТРЕЛКИ */
.prev { bottom: 12%; left: 10%; width: 80px; height: 60px; }
.next { bottom: 12%; right: 10%; width: 80px; height: 60px; }

/* НАЗАД */
.back { bottom: 3%; left: 28%; width: 160px; height: 55px; }


</style>
</head>

<body>

<!-- ===== МЕНЮ (ТВОЯ КАРТИНКА) ===== -->
<div id="menu" class="page active">
  <div class="container">
    <img src="menu.png" class="bg">

    <!-- КНОПКИ -->
    <div class="click btn1" onclick="openPage('alif')"></div>
    <div class="click btn2"></div>

    <div class="click btn3"></div>
    <div class="click btn4"></div>

    <div class="click btn5"></div>
    <div class="click btn6"></div>

    <!-- НАЗАД -->
    <div class="click backMenu"></div>
  </div>
</div>

<!-- ===== АЛИФ ===== -->
<div id="alif" class="page">
  <div class="container">
    <img src="alif.png" class="bg">

    <!-- МАХРАДЖ -->
    <div class="click mouth" onclick="playAlif()"></div>

    <!-- ХАРАКАТЫ -->
    <div class="click a" onclick="playA()"></div>
    <div class="click i" onclick="playI()"></div>
    <div class="click u" onclick="playU()"></div>

    <!-- СТРЕЛКИ -->
    <div class="click prev"></div>
    <div class="click next"></div>

    <!-- НАЗАД -->
    <div class="click back" onclick="openPage('menu')"></div>

  </div>
</div>

<script>

/* ПЕРЕКЛЮЧЕНИЕ */
function openPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* ===== ПРАВИЛЬНЫЕ ЗВУКИ ===== */

function playAlif() {
    new Audio("sounds/alif.mp3").play();
}

function playA() {
    new Audio("sounds/alif_a.mp3").play();
}

function playI() {
    new Audio("sounds/alif_i.mp3").play();
}

function playU() {
    new Audio("sounds/alif_u.mp3").play();
}

</script>

</body>
</html>
