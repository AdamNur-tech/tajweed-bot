<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>TajweedPro</title>

<style>

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #0f2e23;
}

/* ОСНОВА */
.wrapper {
    max-width: 420px;
    margin: auto;
    min-height: 100vh;
    padding: 15px;
    box-sizing: border-box;

    background:
    url("https://www.transparenttextures.com/patterns/arabesque.png"),
    linear-gradient(#f3e2b8,#d6bc7f);

    background-size: 200px, cover;
}

/* АРКА */
.header {
    background: linear-gradient(180deg,#1e4b3a,#123126);
    border-radius: 30px;
    padding: 22px;
    text-align: center;

    color: #ffd700;
    font-size: 22px;
    font-weight: bold;

    box-shadow:
        inset 0 0 20px rgba(0,0,0,0.6),
        0 6px 12px rgba(0,0,0,0.4);
}

/* СЕТКА */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 15px;
}

/* КАРТОЧКИ */
.card {
    background: linear-gradient(145deg,#f9e6b5,#caa75c);
    border-radius: 20px;
    padding: 20px;

    text-align: center;
    font-weight: bold;
    color: #2a2a2a;

    box-shadow:
        0 8px 18px rgba(0,0,0,0.4),
        inset 0 2px 5px rgba(255,255,255,0.5);

    cursor: pointer;
    transition: 0.2s;
}

.card:active {
    transform: scale(0.95);
}

/* ИКОНКИ */
.icon {
    font-size: 30px;
    margin-bottom: 8px;
}

/* НИЖНИЕ КНОПКИ */
.bottom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 12px;
}

.small-card {
    background: linear-gradient(145deg,#e8d29a,#bfa45a);
    border-radius: 15px;
    padding: 12px;

    text-align: center;
    font-weight: 500;

    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

/* ХАДИС */
.hadith {
    margin-top: 25px;
    text-align: center;
}

.hadith-ar {
    font-size: 18px;
    color: #b38b2d;
    margin-bottom: 6px;
}

.hadith-ru {
    font-size: 14px;
    color: #333;
}

/* КНОПКА НАЗАД */
.back {
    margin-top: 20px;
    padding: 15px;
    border-radius: 20px;

    background: linear-gradient(#2f5a45,#1c3a2d);
    color: white;
    text-align: center;
    font-weight: bold;

    box-shadow: 0 5px 12px rgba(0,0,0,0.4);
}

</style>
</head>

<body>

<div class="wrapper">

<div class="header">
📖 Изучение Таджвида
</div>

<div class="grid">

<div class="card" onclick="openModule('alphabet')">
<div class="icon">📖</div>
Алфавит
</div>

<div class="card" onclick="openModule('tajweed')">
<div class="icon">📜</div>
Правила
</div>

<div class="card" onclick="openModule('forms')">
<div class="icon">🔤</div>
Формы
</div>

<div class="card" onclick="openModule('practice')">
<div class="icon">🎧</div>
Практика
</div>

</div>

<div class="bottom-grid">

<div class="small-card">📘 Словарь</div>
<div class="small-card">✅ Тесты</div>

</div>

<div class="hadith">

<div class="hadith-ar">
خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ
</div>

<div class="hadith-ru">
Лучший из вас тот, кто изучает Коран и обучает ему
</div>

</div>

<div class="back" onclick="goBack()">⬅️ Назад</div>

</div>

<script>
function openModule(module) {
    Telegram.WebApp.sendData(module);
}

function goBack() {
    Telegram.WebApp.close();
}
</script>

</body>
</html>
