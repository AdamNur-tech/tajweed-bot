<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tajweed AI PRO</title>
<style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#fff}
.header{padding:14px;text-align:center;background:#020617}
.wrap{padding:16px}
.card{background:#1e293b;border-radius:14px;padding:16px;margin-top:12px}
.big{font-size:54px;text-align:center;margin:8px 0}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;background:#22c55e;color:#fff}
.alt{background:#334155}
.progress{height:8px;background:#334155;border-radius:8px;margin-top:8px}
.bar{height:8px;background:#22c55e;border-radius:8px;width:0%}
.hidden{display:none}
</style>
</head>
<body>

<div class="header">🕌 Tajweed AI PRO</div>

<div id="home" class="wrap">
  <button onclick="start()">📚 Продолжить</button>
  <button class="alt" onclick="askAI()">🧠 Спросить учителя</button>
</div>

<div id="lesson" class="wrap hidden">
  <div class="card">
    <div class="big" id="l_title"></div>
    <div id="l_text"></div>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <button onclick="toQuiz()">Далее</button>
  </div>
</div>

<div id="quiz" class="wrap hidden">
  <div class="card">
    <h3 id="q_text"></h3>
    <button id="a0" onclick="answer(0)"></button>
    <button id="a1" onclick="answer(1)"></button>
    <button id="a2" onclick="answer(2)"></button>
  </div>
</div>

<div id="result" class="wrap hidden">
  <div class="card">
    <h2 id="res"></h2>
    <button onclick="next()">Дальше</button>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
let uid = params.get("uid") || "1"; // для теста

let state = null;

function show(id){
  ["home","lesson","quiz","result"].forEach(s=>document.getElementById(s).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

async function load(){
  const r = await fetch(`/api/state?uid=${uid}`);
  state = await r.json();
}

function start(){
  load().then(()=>{
    if(!state.item){ alert("Курс закончен"); return; }
    document.getElementById("l_title").innerText = state.item.title || "Урок";
    document.getElementById("l_text").innerText = state.item.content || "";
    const p = (state.user.step / 5) * 100;
    document.getElementById("bar").style.width = p + "%";
    show("lesson");
  });
}

function toQuiz(){
  const it = state.item;
  if(it.type!=="quiz"){ next(); return; }
  document.getElementById("q_text").innerText = it.q;
  it.opts.forEach((o,i)=>document.getElementById("a"+i).innerText=o);
  show("quiz");
}

async function answer(i){
  const r = await fetch("/api/answer",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({uid:uid, i:i})
  });
  const d = await r.json();
  document.getElementById("res").innerText = d.correct ? "✅ Правильно" : "❌ Ошибка";
  show("result");
}

async function next(){
  await fetch("/api/next",{method:"POST",headers:{"Content-Type":"application/json"},
    body: JSON.stringify({uid:uid})});
  start();
}

async function askAI(){
  const q = prompt("Что объяснить?");
  if(!q) return;
  const r = await fetch("/api/ai_explain",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({text:q})
  });
  const d = await r.json();
  alert(d.answer);
}
</script>
</body>
</html>
