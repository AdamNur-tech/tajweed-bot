<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tajweed App</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f3b2e;
    color: white;
    text-align: center;
}

.screen {
    display: none;
    padding: 20px;
}

#main {
    display: block;
}

/* КНОПКИ */
.btn {
    display: block;
    width: 90%;
    margin: 10px auto;
    padding: 15px;
    font-size: 18px;
    border-radius: 12px;
    border: none;
    background: gold;
    color: black;
    font-weight: bold;
}

/* КНОПКИ НАЗАД */
.back {
    background: #1f5c45;
    color: white;
}

/* БУКВА */
.letter {
    font-size: 80px;
    margin: 20px 0;
}

/* КНОПКИ ЗВУКА */
.sound-btn {
    margin: 5px;
    padding: 10px;
    font-size: 16px;
}
</style>

</head>
<body>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="main">

<h2>📖 Изучение таджвида</h2>

<button class="btn" onclick="openModule('alphabet')">Алфавит</button>

<button class="btn" onclick="openModule('rules')">Правила таджвида</button>

<button class="btn" onclick="openModule('forms')">Видоизменение букв</button>

<button class="btn" onclick="openModule('practice')">Практика чтения</button>

<button class="btn" onclick="openModule('qiraat')">Виды чтения</button>

<button class="btn" onclick="openModule('lessons')">Уроки</button>

</div>

<!-- АЛФАВИТ -->
<div id="alphabet" class="screen">

<h2>Алфавит</h2>

<div class="letter" onclick="playSound()">ا</div>

<h3>Алиф</h3>

<p>🔊 Звук: А</p>

<button class="sound-btn" onclick="playSound()">🔊 Прослушать</button>

<p>Алиф — первая буква арабского алфавита</p>

<h3>Харакаты:</h3>

<button class="sound-btn" onclick="playFatha()">َ А</button>
<button class="sound-btn" onclick="playKasra()">ِ И</button>
<button class="sound-btn" onclick="playDamma()">ُ У</button>

<br><br>

<button class="btn back" onclick="goBack()">← Назад</button>

</div>

<!-- ДРУГИЕ ЭКРАНЫ -->
<div id="rules" class="screen">
<h2>Правила таджвида</h2>
<button class="btn back" onclick="goBack()">← Назад</button>
</div>

<div id="forms" class="screen">
<h2>Видоизменение букв</h2>
<button class="btn back" onclick="goBack()">← Назад</button>
</div>

<div id="practice" class="screen">
<h2>Практика чтения</h2>
<button class="btn back" onclick="goBack()">← Назад</button>
</div>

<div id="qiraat" class="screen">
<h2>Виды чтения</h2>
<button class="btn back" onclick="goBack()">← Назад</button>
</div>

<div id="lessons" class="screen">
<h2>Уроки</h2>
<button class="btn back" onclick="goBack()">← Назад</button>
</div>
