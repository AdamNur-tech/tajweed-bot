<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>TajweedPro</title>

<style>

body {
    margin: 0;
    background: #e6d3a3;
    font-family: sans-serif;
}

/* ФОН С УЗОРОМ */
.wrapper {
    max-width: 420px;
    margin: auto;
    padding: 10px;

    background:
    url("https://www.transparenttextures.com/patterns/arabesque.png"),
    #e6d3a3;
}

/* ЗАГОЛОВОК */
.header {
    background: linear-gradient(#1e4b3a,#123126);
    border-radius: 40px;
    padding: 18px;
    text-align: center;
    color: gold;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

/* СЕТКА */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

/* КАРТОЧКИ = КАРТИНКИ */
.card img {
    width: 100%;
    border-radius: 18px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.4);
}

/* НИЖНИЕ */
.bottom {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.bottom img {
    width: 50%;
    border-radius: 12px;
}

/* ХАДИС */
.hadith {
    text-align: center;
    margin-top: 20px;
}

.hadith-ar {
    color: #b38b2d;
    font-size: 16px;
}

.hadith-ru {
    font-size: 14px;
}

/* НАЗАД */
.back {
    margin-top: 15px;
    padding: 14px;
    border-radius: 20px;
    background: linear-gradient(#2f5a45,#1c3a2d);
    color: white;
    text-align: center;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="wrapper">

<div class="header">
📖 Изучение Таджвида
</div>

<div class="grid">

<div class="card" onclick="openModule('alphabet')">
<img src="https://i.imgur.com/3QZ7Z7b.png">
</div>

<div class="card" onclick="openModule('tajweed')">
<img src="https://i.imgur.com/2b9Yy7L.png">
</div>

<div class="card" onclick="openModule('forms')">
<img src="https://i.imgur.com/Y7b9K3D.png">
</div>

<div class="card" onclick="openModule('practice')">
<img src="https://i.imgur.com/4Zp7m5S.png">
</div>

</div>

<div class="bottom">

<img src="https://i.imgur.com/vK6pF8x.png">
<img src="https://i.imgur.com/jL9F4Vd.png">

</div>

<div class="hadith">

<div class="hadith-ar">
خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ
</div>

<div class="hadith-ru">
Лучший из вас тот, кто изучает Коран и обучает ему
</div>

</div>

<div class="back" onclick="goBack()">⬅️ Назад</div>

</div>

<script>
function openModule(module) {
    Telegram.WebApp.sendData(module);
}

function goBack() {
    Telegram.WebApp.close();
}
</script>

</body>
</html>
