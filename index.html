<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tajweed App</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial;
    background: #0f4d3a;
    color: white;
}

/* ===== СТРАНИЦЫ ===== */
.page {
    display: none;
    min-height: 100vh;
    padding: 20px;
}

.active {
    display: block;
}

/* ===== КОНТЕЙНЕР ===== */
.container {
    max-width: 500px;
    margin: auto;
    text-align: center;
}

/* ===== МЕНЮ ===== */
.menu-btn {
    background: gold;
    color: black;
    padding: 16px;
    margin: 10px 0;
    width: 100%;
    border-radius: 15px;
    font-size: 18px;
    font-weight: bold;
}

/* ===== БУКВА ===== */
.letter {
    font-size: 100px;
    margin-top: 30px;
}

.title {
    font-size: 28px;
    margin: 10px 0;
}

.sound-btn {
    background: #ddd;
    color: black;
    padding: 12px 20px;
    border-radius: 10px;
    margin: 15px 0;
}

/* ===== ХАРАКАТЫ ===== */
.harakat {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
}

.harakat button {
    padding: 12px;
    border-radius: 10px;
    border: none;
}

/* ===== НАЗАД ===== */
.back {
    margin-top: 30px;
    background: #1f6b4d;
    padding: 12px;
    border-radius: 12px;
}
</style>
</head>

<body>

<!-- ===== МЕНЮ ===== -->
<div id="menu" class="page active">
<div class="container">

<h2>📖 Изучение таджвида</h2>

<div class="menu-btn" onclick="openPage('alphabet')">Алфавит</div>
<div class="menu-btn">Правила таджвида</div>
<div class="menu-btn">Видоизменение букв</div>
<div class="menu-btn">Практика чтения</div>
<div class="menu-btn">Виды чтения</div>
<div class="menu-btn">Уроки</div>

</div>
</div>

<!-- ===== АЛИФ ===== -->
<div id="alphabet" class="page">
<div class="container">

<div class="letter">ا</div>
<div class="title">Алиф</div>

<div>🔊 Звук: А</div>

<div class="sound-btn" onclick="playSound('ا')">
🔊 Прослушать
</div>

<p>Алиф — первая буква арабского алфавита</p>

<h3>Харакаты:</h3>

<div class="harakat">
<button onclick="playSound('اَ')">А</button>
<button onclick="playSound('اِ')">И</button>
<button onclick="playSound('اُ')">У</button>
</div>

<div class="back" onclick="openPage('menu')">← Назад</div>

</div>
</div>

<script>
function openPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function playSound(text) {
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "ar-SA";
    msg.rate = 0.8;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(msg);
}
</script>

</body>
</html>
