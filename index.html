<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>TajweedPro</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #0f2e23;
}

/* ОБЩАЯ РАМКА */
.wrapper {
    max-width: 420px;
    margin: auto;
    background: linear-gradient(#f1e0b5, #d8be84);
    min-height: 100vh;
    padding: 15px;
    box-sizing: border-box;
}

/* ВЕРХ (ЗЕЛЁНАЯ АРКА) */
.header {
    background: linear-gradient(#1e4b3a, #123126);
    border-radius: 20px;
    padding: 18px;
    text-align: center;
    color: gold;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

/* СЕТКА */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

/* КАРТОЧКИ */
.card {
    background: linear-gradient(145deg, #f7e2a6, #caa85a);
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    font-weight: bold;
    color: #2b2b2b;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: 0.2s;
}

.card:active {
    transform: scale(0.95);
}

.card-title {
    margin-top: 10px;
}

/* НИЖНИЕ КНОПКИ */
.bottom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
}

.small-card {
    background: linear-gradient(145deg, #e7d29a, #bfa45a);
    padding: 10px;
    border-radius: 12px;
    text-align: center;
    font-size: 14px;
}

/* ХАДИС */
.hadith {
    margin-top: 20px;
    text-align: center;
}

.hadith-ar {
    color: #b38b2d;
    font-size: 16px;
    margin-bottom: 5px;
}

.hadith-ru {
    font-size: 13px;
    color: #333;
}

/* НАЗАД */
.back {
    margin-top: 15px;
    padding: 12px;
    border-radius: 12px;
    background: #2c4d3b;
    color: white;
    text-align: center;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="header">
📖 Изучение Таджвида
</div>

<div class="grid">

<div class="card" onclick="openModule('alphabet')">
📖
<div class="card-title">Алфавит</div>
</div>

<div class="card" onclick="openModule('tajweed')">
📜
<div class="card-title">Правила</div>
</div>

<div class="card" onclick="openModule('forms')">
🔤
<div class="card-title">Формы</div>
</div>

<div class="card" onclick="openModule('practice')">
🎧
<div class="card-title">Практика</div>
</div>

</div>

<div class="bottom-grid">

<div class="small-card">📘 Словарь</div>
<div class="small-card">✅ Тесты</div>

</div>

<div class="hadith">

<div class="hadith-ar">
خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ
</div>

<div class="hadith-ru">
Лучший из вас тот, кто изучает Коран и обучает ему
</div>

</div>

<div class="back" onclick="goBack()">⬅️ Назад</div>

</div>

<script>
function openModule(module) {
    Telegram.WebApp.sendData(module);
}

function goBack() {
    Telegram.WebApp.close();
}
</script>

</body>
</html>
