<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tajweed App</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: black;
}

/* ЭКРАНЫ */
.screen {
    display: none;
}

#main {
    display: block;
    position: relative;
}

/* КАРТИНКА */
.bg {
    width: 100%;
    height: auto;
    display: block;
}

/* АЛФАВИТ */
.alphabet {
    background: #0f3b2e;
    color: white;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
}

.letter {
    font-size: 90px;
    margin-top: 20px;
}

/* КНОПКИ */
button {
    padding: 12px;
    margin: 6px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
}

.sound-btn {
    background: white;
}

.back-btn {
    margin-top: 30px;
    background: #1f5c45;
    color: white;
    width: 80%;
    font-size: 18px;
}
</style>

</head>
<body>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="main">

<img src="menu.png" class="bg">

<!-- НЕВИДИМЫЕ КНОПКИ (подгонка под картинку) -->
<button onclick="openModule('alphabet')" style="position:absolute; top:38%; left:5%; width:40%; height:12%; opacity:0;"></button>

<button onclick="openModule('rules')" style="position:absolute; top:38%; right:5%; width:40%; height:12%; opacity:0;"></button>

<button onclick="openModule('forms')" style="position:absolute; top:53%; left:5%; width:40%; height:12%; opacity:0;"></button>

<button onclick="openModule('practice')" style="position:absolute; top:53%; right:5%; width:40%; height:12%; opacity:0;"></button>

<button onclick="openModule('qiraat')" style="position:absolute; top:68%; left:5%; width:40%; height:10%; opacity:0;"></button>

<button onclick="openModule('lessons')" style="position:absolute; top:68%; right:5%; width:40%; height:10%; opacity:0;"></button>

</div>

<!-- АЛФАВИТ -->
<div id="alphabet" class="screen alphabet">

<div class="letter" onclick="playSound()">ا</div>

<h2>Алиф</h2>

<p>🔊 Звук: А</p>

<button class="sound-btn" onclick="playSound()">🔊 Прослушать</button>

<p>Алиф — первая буква арабского алфавита</p>

<h3>Харакаты:</h3>

<br>

<button onclick="playFatha()">أَ</button>
<button onclick="playKasra()">إِ</button>
<button onclick="playDamma()">أُ</button>

<br>

<button class="back-btn" onclick="goBack()">← Назад</button>

</div>

<!-- ДРУГИЕ ЭКРАНЫ -->
<div id="rules" class="screen alphabet">
<h2>Правила таджвида</h2>
<button class="back-btn" onclick="goBack()">← Назад</button>
</div>

<div id="forms" class="screen alphabet">
<h2>Видоизменение букв</h2>
<button class="back-btn" onclick="goBack()">← Назад</button>
</div>

<div id="practice" class="screen alphabet">
<h2>Практика чтения</h2>
<button class="back-btn" onclick="goBack()">← Назад</button>
</div>

<div id="qiraat" class="screen alphabet">
<h2>Виды чтения</h2>
<button class="back-btn" onclick="goBack()">← Назад</button>
</div>

<div id="lessons" class="screen alphabet">
<h2>Уроки</h2>
<button class="back-btn" onclick="goBack()">← Назад</button>
</div>

<!-- JS -->
<script>

function openModule(module) {
    document.getElementById("main").style.display = "none";

    document.querySelectorAll(".screen").forEach(el => {
        el.style.display = "none";
    });

    document.getElementById(module).style.display = "block";
}

function goBack() {
    document.querySelectorAll(".screen").forEach(el => {
        el.style.display = "none";
    });

    document.getElementById("main").style.display = "block";
}

/* ЗВУК (ИСПРАВЛЕННЫЙ) */
function playSound() {
    speechSynthesis.cancel();

    let s = new SpeechSynthesisUtterance("أَ");
    s.lang = "ar-SA";
    s.rate = 0.8;

    window.speechSynthesis.speak(s);
}

function playFatha() {
    speechSynthesis.cancel();
    let s = new SpeechSynthesisUtterance("أَ");
    s.lang = "ar-SA";
    speechSynthesis.speak(s);
}

function playKasra() {
    speechSynthesis.cancel();
    let s = new SpeechSynthesisUtterance("إِ");
    s.lang = "ar-SA";
    speechSynthesis.speak(s);
}

function playDamma() {
    speechSynthesis.cancel();
    let s = new SpeechSynthesisUtterance("أُ");
    s.lang = "ar-SA";
    speechSynthesis.speak(s);
}

</script>

</body>
</html>
