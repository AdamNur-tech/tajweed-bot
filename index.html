<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tajweed App</title>

<style>

/* ОБЩЕЕ */
body {
  margin: 0;
  background: #0f4c3a;
  font-family: sans-serif;
}

/* СТРАНИЦЫ */
.page {
  display: none;
}
.active {
  display: block;
}

/* КОНТЕЙНЕР */
.container {
  position: relative;
  max-width: 420px;
  margin: auto;
}

.bg {
  width: 100%;
  display: block;
}

/* УБРАТЬ СИНИЙ КЛИК */
* {
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* БУКВА */
.letter {
  position: absolute;
  top: 12%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 90px;
  font-weight: bold;
}

/* НАЗВАНИЕ */
.name {
  position: absolute;
  top: 22%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 32px;
}

/* ХАРАКАТЫ */
.click {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: 28px;
  cursor: pointer;
}

/* позиция */
.a { top: 72%; left: 25%; }
.i { top: 72%; left: 37%; }
.u { top: 72%; left: 47%; }

/* КНОПКИ */
.prev {
  position: absolute;
  bottom: 10%;
  left: 10%;
}
.next {
  position: absolute;
  bottom: 10%;
  right: 10%;
}
.back {
  position: absolute;
  bottom: 3%;
  left: 50%;
  transform: translateX(-50%);
}

button {
  padding: 8px 12px;
  font-size: 16px;
}

/* МЕНЮ */
.menu-btn {
  display: block;
  width: 80%;
  margin: 10px auto;
  padding: 15px;
  font-size: 18px;
}

</style>
</head>

<body>

<!-- ================= МЕНЮ ================= -->
<div id="menu" class="page active">
  <div class="container">
    <img src="images/menu.jpg" class="bg">

    <button class="menu-btn" onclick="openPage('alif')">Алиф</button>
    <button class="menu-btn" onclick="openPage('ba')">Ба</button>
  </div>
</div>

<!-- ================= АЛИФ ================= -->
<div id="alif" class="page">
  <div class="container">
    <img src="images/template.png" class="bg">

    <div class="letter">ا</div>
    <div class="name">Алиф</div>

    <div class="click a" onclick="play('a')">اَ</div>
    <div class="click i" onclick="play('i')">اِ</div>
    <div class="click u" onclick="play('u')">اُ</div>

    <button class="prev" onclick="openPage('menu')">←</button>
    <button class="next" onclick="openPage('ba')">→</button>
    <button class="back" onclick="openPage('menu')">Назад</button>
  </div>
</div>

<!-- ================= БА ================= -->
<div id="ba" class="page">
  <div class="container">
    <img src="images/template.png" class="bg">

    <div class="letter">ب</div>
    <div class="name">Ба</div>

    <div class="click a" onclick="play('ba_a')">بَ</div>
    <div class="click i" onclick="play('ba_i')">بِ</div>
    <div class="click u" onclick="play('ba_u')">بُ</div>

    <button class="prev" onclick="openPage('alif')">←</button>
    <button class="next" onclick="openPage('menu')">→</button>
    <button class="back" onclick="openPage('menu')">Назад</button>
  </div>
</div>

<script>

/* ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ */
function openPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ЗВУК (пока заглушка) */
function play(sound) {
  alert("Звук: " + sound);
}

</script>

</body>
</html>
