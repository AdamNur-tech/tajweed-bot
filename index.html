<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tajweed App</title>

<style>

/* ОБЩЕЕ */
body {
    margin: 0;
    background: #0f4c3a;
}

/* СТРАНИЦЫ */
.page { display: none; }
.active { display: block; }

/* КОНТЕЙНЕР */
.container {
    position: relative;
    max-width: 420px;
    margin: auto;
}

/* ФОН */
.bg {
    width: 100%;
    display: block;
}

/* КНОПКИ */
.click {
    position: absolute;
    transform: translate(-50%, -50%);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

/* ===== МЕНЮ ===== */
.btn1 { top: 42%; left: 8%; width: 38%; height: 12%; }
.btn2 { top: 42%; right: 8%; width: 38%; height: 12%; }

/* ===== ОБЩИЕ КНОПКИ ===== */
.prev { top: 88%; left: 18%; width: 70px; height: 50px; }
.next { top: 88%; left: 82%; width: 70px; height: 50px; }
.back { top: 88%; left: 50%; width: 150px; height: 50px; }

/* ХАРАКАТЫ */
.a { top: 71.7%; left: 23.7%; width: 40px; height: 60px; }
.i { top: 70.66%; left: 36.46%; width: 40px; height: 60px; }
.u { top: 71.35%; left: 46.61%; width: 40px; height: 60px; }

/* РОТ */
.mouth {
    top: 64%;
    left: 73%;
    width: 70px;
    height: 70px;
}

</style>
</head>

<body>

<!-- ===== МЕНЮ ===== -->
<div id="menu" class="page active">
    <div class="container">
        <img src="menu.png" class="bg">

        <div class="click btn1" onclick="openPage('alif')"></div>
        <div class="click btn2" onclick="openPage('ba')"></div>
    </div>
</div>

<!-- ===== АЛИФ ===== -->
<div id="alif" class="page">
    <div class="container">
        <img src="Alif.png" class="bg">

        <div class="click mouth" onclick="playSound('alif')"></div>

        <div class="click a" onclick="playSound('alif_a')"></div>
        <div class="click i" onclick="playSound('alif_i')"></div>
        <div class="click u" onclick="playSound('alif_u')"></div>

        <div class="click prev"></div>
        <div class="click next" onclick="openPage('ba')"></div>
        <div class="click back" onclick="openPage('menu')"></div>
    </div>
</div>

<!-- ===== БА ===== -->
<div id="ba" class="page">
    <div class="container">
        <img src="ba.png" class="bg">

        <div class="click mouth" onclick="playSound('ba')"></div>

        <div class="click a" onclick="playSound('ba_a')"></div>
        <div class="click i" onclick="playSound('ba_i')"></div>
        <div class="click u" onclick="playSound('ba_u')"></div>

        <div class="click prev" onclick="openPage('alif')"></div>
        <div class="click next"></div>
        <div class="click back" onclick="openPage('menu')"></div>
    </div>
</div>

<script>

/* ПЕРЕКЛЮЧЕНИЕ */
function openPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* ЗВУК */
function playSound(name) {
    new Audio("sounds/" + name + ".mp3").play();
}

</script>

</body>
</html>
