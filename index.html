<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tajweed</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0f3b2e;
    display: flex;
    justify-content: center;
}

/* контейнер */
.container {
    position: relative;
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
}

/* картинка */
.bg {
    width: 100%;
    display: block;
}

/* кнопки */
.btn {
    position: absolute;
    background: transparent;
    border: none;
}

/* === КНОПКИ === */

/* 1 ряд */
.btn1 { top: 36%; left: 6%; width: 40%; height: 11%; }
.btn2 { top: 36%; right: 6%; width: 40%; height: 11%; }

/* 2 ряд */
.btn3 { top: 50%; left: 6%; width: 40%; height: 11%; }
.btn4 { top: 50%; right: 6%; width: 40%; height: 11%; }

/* 3 ряд */
.btn5 { top: 64%; left: 6%; width: 40%; height: 9%; }
.btn6 { top: 64%; right: 6%; width: 40%; height: 9%; }

/* назад */
.back {
    top: 84%;
    left: 10%;
    width: 80%;
    height: 8%;
}

/* скрытые экраны */
.screen {
    display: none;
    padding: 20px;
    color: white;
    text-align: center;
}

.screen button {
    margin-top: 20px;
    padding: 10px 20px;
}
</style>
</head>

<body>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="main" class="screen" style="display:block;">

<div class="container">

    <img src="menu.png" class="bg">

    <!-- КНОПКИ -->
    <button class="btn btn1" onclick="openModule('alphabet')"></button>
    <button class="btn btn2" onclick="openModule('rules')"></button>

    <button class="btn btn3" onclick="openModule('forms')"></button>
    <button class="btn btn4" onclick="openModule('practice')"></button>

    <button class="btn btn5" onclick="openModule('qiraat')"></button>
    <button class="btn btn6" onclick="openModule('lessons')"></button>

    <button class="btn back" onclick="goBack()"></button>

</div>

</div>

<!-- ЭКРАНЫ -->

<div id="alphabet" class="screen">
    <h2>Алфавит</h2>
    <button onclick="goBack()">⬅ Назад</button>
</div>

<div id="rules" class="screen">
    <h2>Правила таджвида</h2>
    <button onclick="goBack()">⬅ Назад</button>
</div>

<div id="forms" class="screen">
    <h2>Видоизменение букв</h2>
    <button onclick="goBack()">⬅ Назад</button>
</div>

<div id="practice" class="screen">
    <h2>Практика чтения</h2>
    <button onclick="goBack()">⬅ Назад</button>
</div>

<div id="qiraat" class="screen">
    <h2>Виды чтения</h2>
    <button onclick="goBack()">⬅ Назад</button>
</div>

<div id="lessons" class="screen">
    <h2>Уроки</h2>
    <button onclick="goBack()">⬅ Назад</button>
</div>

<script>
function openModule(module) {
    document.getElementById("main").style.display = "none";
    document.getElementById(module).style.display = "block";
}

function goBack() {
    document.querySelectorAll(".screen").forEach(el => el.style.display = "none");
    document.getElementById("main").style.display = "block";
}
</script>

</body>
</html>
