<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tajweed App</title>

<style>

/* ОБЩЕЕ */
body {
    margin: 0;
    font-family: Arial;
    background: #0f4c3a;
    color: white;
}

.page {
    display: none;
}

.active {
    display: block;
}

/* ================= МЕНЮ ================= */

.menu {
    text-align: center;
    padding: 20px;
}

.menu h1 {
    font-size: 24px;
}

.menu button {
    width: 90%;
    padding: 15px;
    margin: 10px;
    font-size: 18px;
    border: none;
    border-radius: 15px;
    background: gold;
    color: black;
}

/* ================= СТРАНИЦА КНИГИ ================= */

.book-page {
    background: #f5f0e6;
    border-radius: 25px;
    padding: 20px;
    margin: 10px;
    box-shadow: 0 0 25px rgba(0,0,0,0.3);
    border: 6px solid gold;
    color: black;
}

/* БУКВА */
.letter {
    font-size: 90px;
    text-align: center;
}

/* КАЛЛИГРАФИЯ */
.calligraphy {
    font-size: 40px;
    text-align: center;
    color: #1b5e20;
}

/* НАЗВАНИЕ */
.name {
    font-size: 26px;
    text-align: center;
    font-weight: bold;
}

.desc {
    text-align: center;
    margin-bottom: 15px;
}

/* МАХРАДЖ */
.makhraj-box {
    background: #ffffffaa;
    padding: 15px;
    border-radius: 15px;
}

.makhraj-title {
    font-weight: bold;
    font-size: 18px;
}

.makhraj-text {
    margin-top: 10px;
}

/* СХЕМА */
.makhraj-visual {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 10px;
    gap: 15px;
}

.mouth {
    font-size: 40px;
    cursor: pointer;
    animation: pulse 1.5s infinite;
}

.air {
    font-size: 25px;
}

.throat {
    font-size: 40px;
}

/* АНИМАЦИЯ */
@keyframes pulse {
    0% {transform: scale(1);}
    50% {transform: scale(1.2);}
    100% {transform: scale(1);}
}

.hint {
    text-align: center;
    font-size: 12px;
}

/* ХАРАКАТЫ */
.harakat {
    display: flex;
    justify-content: space-around;
    margin-top: 15px;
}

.h-box {
    background: white;
    padding: 10px;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
}

.arabic {
    font-size: 24px;
}

/* НОМЕР */
.page-num {
    text-align: center;
    font-size: 22px;
    margin-top: 10px;
}

/* НАВИГАЦИЯ */
.nav {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
}

.nav button {
    padding: 10px 20px;
}

/* НАЗАД */
.back {
    display: block;
    margin: 15px auto;
    padding: 10px 20px;
}

</style>
</head>

<body>

<!-- ================= МЕНЮ ================= -->

<div id="menu" class="page active">
  <div class="menu">
    <h1>📖 Изучение таджвида</h1>

    <button onclick="openPage('alif')">Алфавит</button>
    <button>Правила таджвида</button>
    <button>Видоизменение букв</button>
    <button>Практика чтения</button>
    <button>Виды чтения</button>
    <button>Уроки</button>
  </div>
</div>

<!-- ================= АЛИФ ================= -->

<div id="alif" class="page">
  <div class="book-page">

    <div class="letter">ا</div>

    <div class="calligraphy">ألف</div>

    <div class="name">Алиф</div>
    <div class="desc">Первая буква арабского алфавита</div>

    <!-- МАХРАДЖ -->
    <div class="makhraj-box">

      <div class="makhraj-title">Махрадж:</div>

      <div class="makhraj-text">
        Алиф выходит из <b>пустоты рта и горла (الجوف)</b><br>
        Звук произносится свободно,<br>
        без сжатия языка и губ.
      </div>

      <div class="makhraj-visual">
        <div class="mouth" onclick="playAlif()">👄</div>
        <div class="air">➜</div>
        <div class="throat">🫁</div>
      </div>

      <div class="hint">Нажми на рот</div>

    </div>

    <!-- ХАРАКАТЫ -->
    <div class="harakat">
      <div class="h-box" onclick="playSound('a')">
        <div class="arabic">اَ</div>
        <div>a</div>
      </div>

      <div class="h-box" onclick="playSound('i')">
        <div class="arabic">اِ</div>
        <div>i</div>
      </div>

      <div class="h-box" onclick="playSound('u')">
        <div class="arabic">اُ</div>
        <div>u</div>
      </div>
    </div>

    <div class="page-num">١</div>

    <div class="nav">
      <button onclick="prevPage()">←</button>
      <button onclick="nextPage()">→</button>
    </div>

    <button class="back" onclick="openPage('menu')">← Назад</button>

  </div>
</div>

<!-- ================= JS ================= -->

<script>

function openPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* ЗВУК */
function playAlif() {
    let msg = new SpeechSynthesisUtterance("ا");
    msg.lang = "ar-SA";
    speechSynthesis.speak(msg);
}

function playSound(vowel) {
    let msg = new SpeechSynthesisUtterance(vowel);
    msg.lang = "ar-SA";
    speechSynthesis.speak(msg);
}

/* пока заглушка */
function nextPage() {
    alert("Дальше будет ب 😎");
}

function prevPage() {
    alert("Это первая страница");
}

</script>

</body>
</html>
