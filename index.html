<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tajweed App</title>

<style>

/* ===== ОБЩЕЕ ===== */
body {
    margin: 0;
    font-family: Arial;
    background: #0f4c3a;
    color: white;
}

.page {
    display: none;
}

.active {
    display: block;
}

/* ===== МЕНЮ ===== */

.menu {
    text-align: center;
    padding: 20px;
}

.menu h1 {
    font-size: 24px;
}

.menu button {
    width: 90%;
    padding: 15px;
    margin: 10px;
    font-size: 18px;
    border: none;
    border-radius: 20px;
    background: gold;
    color: black;
}

/* ===== СТРАНИЦА С КАРТИНКОЙ ===== */

.image-container {
    position: relative;
    width: 100%;
    max-width: 420px;
    margin: auto;
}

.bg {
    width: 100%;
    display: block;
}

/* КНОПКИ */
.click {
    position: absolute;
}

/* 👄 РОТ */
.mouth {
    top: 58%;
    left: 58%;
    width: 70px;
    height: 70px;
}

/* ХАРАКАТЫ */
.a {
    top: 63%;
    left: 20%;
    width: 50px;
    height: 70px;
}

.i {
    top: 63%;
    left: 40%;
    width: 50px;
    height: 70px;
}

.u {
    top: 63%;
    left: 60%;
    width: 50px;
    height: 70px;
}

/* СТРЕЛКИ */
.prev {
    bottom: 12%;
    left: 10%;
    width: 70px;
    height: 50px;
}

.next {
    bottom: 12%;
    right: 10%;
    width: 70px;
    height: 50px;
}

/* НАЗАД */
.back {
    bottom: 3%;
    left: 30%;
    width: 150px;
    height: 50px;
}

</style>
</head>

<body>

<!-- ===== МЕНЮ ===== -->

<div id="menu" class="page active">
  <div class="menu">
    <h1>📖 Изучение таджвида</h1>

    <button onclick="openPage('alif')">Алфавит</button>
    <button>Правила таджвида</button>
    <button>Видоизменение букв</button>
    <button>Практика чтения</button>
    <button>Виды чтения</button>
    <button>Уроки</button>
  </div>
</div>

<!-- ===== АЛИФ ===== -->

<div id="alif" class="page">

  <div class="image-container">

    <!-- ВАША КАРТИНКА -->
    <img src="alif.png" class="bg">

    <!-- 👄 РОТ -->
    <div class="click mouth" onclick="playAlif()"></div>

    <!-- ХАРАКАТЫ -->
    <div class="click a" onclick="playSound('a')"></div>
    <div class="click i" onclick="playSound('i')"></div>
    <div class="click u" onclick="playSound('u')"></div>

    <!-- СТРЕЛКИ -->
    <div class="click prev" onclick="prevPage()"></div>
    <div class="click next" onclick="nextPage()"></div>

    <!-- НАЗАД -->
    <div class="click back" onclick="openPage('menu')"></div>

  </div>

</div>

<!-- ===== JS ===== -->

<script>

function openPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* ЗВУК */
function playAlif() {
    let msg = new SpeechSynthesisUtterance("ا");
    msg.lang = "ar-SA";
    speechSynthesis.speak(msg);
}

function playSound(vowel) {
    let msg = new SpeechSynthesisUtterance(vowel);
    msg.lang = "ar-SA";
    speechSynthesis.speak(msg);
}

/* НАВИГАЦИЯ */
function nextPage() {
    alert("Дальше будет ب 😎");
}

function prevPage() {
    alert("Это первая страница");
}

</script>

</body>
</html>
