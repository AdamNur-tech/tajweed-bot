<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tajweed App</title>

<style>
body {
  margin: 0;
  background: #0f4c3a;
  display: flex;
  justify-content: center;
}

.container {
  position: relative;
  max-width: 420px;
  width: 100%;
}

.bg {
  width: 100%;
  display: block;
}

/* страницы */
.page { display: none; }
.active { display: block; }

/* ===== КНОПКА МЕНЮ ===== */
.menu-btn {
  position: absolute;
  width: 220px;
  height: 100px;
  background: transparent;
  border: none;
}

/* АЛФАВИТ */
.alphabet {
  top: 42%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* ===== БУКВА ===== */
.letter {
  position: absolute;
  top: 18%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 80px;
  font-weight: bold;
}

.name {
  position: absolute;
  top: 28%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 28px;
  font-weight: bold;
}

/* ХАРАКАТЫ */
.btn {
  position: absolute;
  width: 50px;
  height: 70px;
  border: 2px solid green;
  background: transparent;
}

.a { top: 71.7%; left: 23.7%; transform: translate(-50%, -50%); }
.i { top: 70.6%; left: 36.4%; transform: translate(-50%, -50%); }
.u { top: 71.3%; left: 46.6%; transform: translate(-50%, -50%); }

/* стрелки */
.prev {
  position: absolute;
  bottom: 12%;
  left: 10%;
}
.next {
  position: absolute;
  bottom: 12%;
  right: 10%;
}

/* назад */
.back {
  position: absolute;
  bottom: 3%;
  left: 30%;
}

/* убрать синий эффект */
* {
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
</style>
</head>

<body>

<!-- ===== МЕНЮ ===== -->
<div id="menu" class="container page active">
  <img src="menu.png" class="bg">

  <!-- КНОПКА АЛФАВИТ -->
  <button class="menu-btn alphabet" onclick="openLetters()"></button>
</div>

<!-- ===== СТРАНИЦА БУКВ ===== -->
<div id="lettersPage" class="container page">

  <img src="alif.png" class="bg">

  <div class="letter" id="letter">ا</div>
  <div class="name" id="name">Алиф</div>

  <button class="btn a" onclick="play()"></button>
  <button class="btn i" onclick="play()"></button>
  <button class="btn u" onclick="play()"></button>

  <button class="prev" onclick="prev()">⬅</button>
  <button class="next" onclick="next()">➡</button>

  <button class="back" onclick="goMenu()">Назад</button>

</div>

<script>
const letters = [
  { ar: "ا", name: "Алиф", sound: "sounds/alif_a.mp3" },
  { ar: "ب", name: "Ба", sound: "sounds/ba_a.mp3" },
  { ar: "ت", name: "Та", sound: "sounds/ta_a.mp3" }
];

let index = 0;

function update() {
  document.getElementById("letter").innerText = letters[index].ar;
  document.getElementById("name").innerText = letters[index].name;
}

function next() {
  if (index < letters.length - 1) {
    index++;
    update();
  }
}

function prev() {
  if (index > 0) {
    index--;
    update();
  }
}

function play() {
  new Audio(letters[index].sound).play();
}

function openLetters() {
  document.getElementById("menu").classList.remove("active");
  document.getElementById("lettersPage").classList.add("active");
}

function goMenu() {
  document.getElementById("lettersPage").classList.remove("active");
  document.getElementById("menu").classList.add("active");
}
</script>

</body>
</html>
