<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tajweed App</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #0f3b2e;
    font-family: Arial;
}

/* ЭКРАНЫ */
.screen {
    display: none;
}

#main {
    display: block;
    position: relative;
}

/* МЕНЮ КАРТИНКА */
.bg {
    width: 100%;
    height: 100vh;
    object-fit: cover;
}

/* АЛФАВИТ */
.alphabet {
    background: #0f3b2e;
    color: white;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
}

.letter {
    font-size: 90px;
    margin-top: 20px;
}

/* КНОПКИ */
button {
    padding: 12px;
    margin: 6px;
    font-size: 16px;
    border-radius: 12px;
    border: none;
}

.sound-btn {
    background: white;
}

.back-btn {
    margin-top: 30px;
    background: #1f5c45;
    color: white;
    width: 80%;
    font-size: 18px;
}
</style>

</head>
<body>

<!-- МЕНЮ -->
<div id="main">

<img src="menu.png" class="bg">

<button onclick="openModule('alphabet')" style="position:absolute; top:37%; left:5%; width:40%; height:12%; opacity:0;"></button>

<button onclick="openModule('rules')" style="position:absolute; top:37%; right:5%; width:40%; height:12%; opacity:0;"></button>

<button onclick="openModule('forms')" style="position:absolute; top:52%; left:5%; width:40%; height:12%; opacity:0;"></button>

<button onclick="openModule('practice')" style="position:absolute; top:52%; right:5%; width:40%; height:12%; opacity:0;"></button>

<button onclick="openModule('qiraat')" style="position:absolute; top:67%; left:5%; width:40%; height:10%; opacity:0;"></button>

<button onclick="openModule('lessons')" style="position:absolute; top:67%; right:5%; width:40%; height:10%; opacity:0;"></button>

</div>

<!-- АЛФАВИТ -->
<div id="alphabet" class="screen alphabet">

<div class="letter" onclick="speak('ا')">ا</div>

<h2>Алиф</h2>

<p>🔊 Звук: А</p>

<button class="sound-btn" onclick="speak('ا')">🔊 Прослушать</button>

<p>Алиф — первая буква арабского алфавита</p>

<h3>Харакаты:</h3>

<button onclick="speak('أَ')">أَ</button>
<button onclick="speak('إِ')">إِ</button>
<button onclick="speak('أُ')">أُ</button>

<br>

<button class="back-btn" onclick="goBack()">← Назад</button>

</div>

<!-- ЭКРАНЫ -->
<div id="rules" class="screen alphabet">
<h2>Правила таджвида</h2>
<button class="back-btn" onclick="goBack()">← Назад</button>
</div>

<div id="forms" class="screen alphabet">
<h2>Видоизменение букв</h2>
<button class="back-btn" onclick="goBack()">← Назад</button>
</div>

<div id="practice" class="screen alphabet">
<h2>Практика чтения</h2>
<button class="back-btn" onclick="goBack()">← Назад</button>
</div>

<div id="qiraat" class="screen alphabet">
<h2>Виды чтения</h2>
<button class="back-btn" onclick="goBack()">← Назад</button>
</div>

<div id="lessons" class="screen alphabet">
<h2>Уроки</h2>
<button class="back-btn" onclick="goBack()">← Назад</button>
</div>

<script>

/* НАВИГАЦИЯ */
function openModule(module) {
    document.getElementById("main").style.display = "none";

    document.querySelectorAll(".screen").forEach(el => {
        el.style.display = "none";
    });

    document.getElementById(module).style.display = "block";
}

function goBack() {
    document.querySelectorAll(".screen").forEach(el => {
        el.style.display = "none";
    });

    document.getElementById("main").style.display = "block";
}

/* ЗВУК (СТАБИЛЬНЫЙ) */
let voices = [];

speechSynthesis.onvoiceschanged = () => {
    voices = speechSynthesis.getVoices();
};

function speak(text) {
    speechSynthesis.cancel();

    let utter = new SpeechSynthesisUtterance(text);

    let arabicVoice = voices.find(v => v.lang.includes("ar"));

    if (arabicVoice) {
        utter.voice = arabicVoice;
    }

    utter.lang = "ar-SA";
    utter.rate = 0.8;

    speechSynthesis.speak(utter);
}

</script>

</body>
</html>
