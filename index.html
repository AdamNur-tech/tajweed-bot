<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tajweed App</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f4d3a;
}

/* ===== СТРАНИЦЫ ===== */
.page { display: none; }
.active { display: block; }

/* ===== МЕНЮ ===== */
.menu {
    position: relative;
    max-width: 420px;
    margin: auto;
}

.menu img {
    width: 100%;
    display: block;
}

.btn {
    position: absolute;
    width: 40%;
    height: 11%;
}

.alphabet { top: 36%; left: 6%; }
.rules    { top: 36%; right: 6%; }
.forms    { top: 51%; left: 6%; }
.practice { top: 51%; right: 6%; }
.types    { top: 66%; left: 6%; }
.lessons  { top: 66%; right: 6%; }

/* ===== КНИГА ===== */
.book {
    max-width: 420px;
    margin: 20px auto;
    background: #fdf6e3;
    color: black;
    border-radius: 20px;
    padding: 20px;
    position: relative;
    border: 8px solid gold;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
}

/* АРАБСКИЙ */
.arabic {
    font-family: 'Amiri', serif;
}

/* БУКВА */
.letter {
    font-size: 120px;
    margin-top: 10px;
}

/* НАЗВАНИЕ */
.name {
    font-size: 40px;
}

/* КНОПКА */
.sound-btn {
    background: #eee;
    padding: 12px;
    border-radius: 12px;
    margin: 15px 0;
}

/* ХАРАКАТЫ */
.harakat {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
}

.harakat button {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: #eee;
}

.harakat span {
    font-size: 28px;
}

.harakat small {
    font-size: 14px;
}

/* НОМЕР */
.page-number {
    text-align: center;
    margin-top: 20px;
    font-size: 22px;
}

/* НАВИГАЦИЯ */
.nav {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
}

.nav button {
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
}
</style>
</head>

<body>

<!-- ===== МЕНЮ ===== -->
<div id="menu" class="page active">
<div class="menu">

<img src="menu.png">

<div class="btn alphabet" onclick="openPage('alif')"></div>
<div class="btn rules"></div>
<div class="btn forms"></div>
<div class="btn practice"></div>
<div class="btn types"></div>
<div class="btn lessons"></div>

</div>
</div>

<!-- ===== СТРАНИЦА АЛИФ ===== -->
<div id="alif" class="page">
<div class="book">

<div class="page-content">

<div class="letter arabic">ا</div>

<div class="arabic name">ألف</div>

<h2>Алиф</h2>

<div class="sound-btn" onclick="playSound('ا')">
🔊 Прослушать
</div>

<p>Алиф — первая буква арабского алфавита</p>

<h3>Харакаты:</h3>

<div class="harakat">

<button onclick="playSound('اَ')">
<span class="arabic">اَ</span>
<small>a</small>
</button>

<button onclick="playSound('اِ')">
<span class="arabic">اِ</span>
<small>i</small>
</button>

<button onclick="playSound('اُ')">
<span class="arabic">اُ</span>
<small>u</small>
</button>

</div>

</div>

<div class="page-number arabic">١</div>

<div class="nav">
<button onclick="prevPage()">←</button>
<button onclick="nextPage()">→</button>
</div>

<div style="text-align:center; margin-top:15px;">
<button onclick="openPage('menu')">← Назад</button>
</div>

</div>
</div>

<script>
function openPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* ЗВУК */
function playSound(text) {
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "ar-SA";
    msg.rate = 0.8;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(msg);
}

/* ПЕРЕЛИСТЫВАНИЕ */
let currentPage = 1;
let totalPages = 28;

function nextPage() {
    if(currentPage < totalPages) {
        alert("Следующая буква (пока не добавлена)");
    }
}

function prevPage() {
    if(currentPage > 1) {
        alert("Предыдущая буква");
    }
}
</script>

</body>
</html>
