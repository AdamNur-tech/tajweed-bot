<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tajweed App</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f4d3a;
}

/* ===== СТРАНИЦЫ ===== */
.page { display: none; }
.active { display: block; }

/* ===== МЕНЮ С КАРТИНКОЙ ===== */
.menu {
    position: relative;
    max-width: 420px;      /* важно: не растягивается */
    margin: auto;
}

.menu img {
    width: 100%;
    display: block;
}

/* КНОПКИ ПОВЕРХ КАРТИНКИ */
.btn {
    position: absolute;
    width: 40%;
    height: 11%;
    cursor: pointer;
}

/* РАСПОЛОЖЕНИЕ КНОПОК (под твою картинку) */
.alphabet { top: 36%; left: 6%; }
.rules    { top: 36%; right: 6%; }
.forms    { top: 51%; left: 6%; }
.practice { top: 51%; right: 6%; }
.types    { top: 66%; left: 6%; }
.lessons  { top: 66%; right: 6%; }

/* ===== СТРАНИЦА БУКВЫ ===== */
.container {
    max-width: 420px;
    margin: auto;
    padding: 20px;
    text-align: center;
    color: white;
}

.letter {
    font-size: 110px;
    margin-top: 30px;
}

.sound-btn {
    background: #eee;
    color: black;
    padding: 12px 20px;
    border-radius: 12px;
    margin: 15px 0;
}

.harakat {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
}

.harakat button {
    padding: 12px;
    border-radius: 10px;
    border: none;
}

.back {
    margin-top: 30px;
    background: #1f6b4d;
    padding: 14px;
    border-radius: 14px;
}
</style>
</head>

<body>

<!-- ===== МЕНЮ ===== -->
<div id="menu" class="page active">
    <div class="menu">
        <!-- ВАЖНО: имя файла картинки -->
        <img src="menu.png">

        <!-- КНОПКИ -->
        <div class="btn alphabet" onclick="openPage('alif')"></div>
        <div class="btn rules"></div>
        <div class="btn forms"></div>
        <div class="btn practice"></div>
        <div class="btn types"></div>
        <div class="btn lessons"></div>
    </div>
</div>

<!-- ===== АЛИФ ===== -->
<div id="alif" class="page">
<div class="container">

<div class="letter">ا</div>
<h2>Алиф</h2>

<div class="sound-btn" onclick="playSound('ا')">
🔊 Прослушать
</div>

<p>Алиф — первая буква арабского алфавита</p>

<h3>Харакаты:</h3>

<div class="harakat">
<button onclick="playSound('اَ')">А</button>
<button onclick="playSound('اِ')">И</button>
<button onclick="playSound('اُ')">У</button>
</div>

<div class="back" onclick="openPage('menu')">← Назад</div>

</div>
</div>

<script>
function openPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* ПРОСТОЙ ЗВУК (можно потом заменить) */
function playSound(text) {
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = "ar-SA";
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(msg);
}
</script>

</body>
</html>
